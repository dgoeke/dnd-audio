[project]
name = "dnd-audio"
version = "0.1.0"
description = "Local audio ingestion and transcription for long tabletop-RPG sessions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# 3.12 exactly. The spec pins it and the target host's system interpreter is 3.13,
# so an upper bound is what makes an unactivated shell fail loudly (ADR-0002).
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=2.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "typer>=0.15",
]

[project.scripts]
dnd-audio = "dnd_audio.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "scipy-stubs>=1.18.0.1",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
]

# Declared, deliberately empty. The Qwen stack pins Transformers and drags in
# Accelerate, Gradio, Flask, and Python SoX; AMD's gfx1151 Torch pulls a
# `rocm[libraries]` sdist that builds at install time. None of that belongs in the
# environment the default test suite runs in (INV-05). M6a fills this in, together
# with the AMD wheel index and per-package sourcing. Until then its emptiness is
# asserted by tests/test_packaging.py.
asr-qwen = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dnd_audio"]

# --- ruff ---------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# This project transcribes natural language. Curly quotes, dashes, and ellipses are what
# the models return and what a transcript must round-trip byte for byte, so they belong
# in test data and in prose. RUF001 is about confusable *identifiers*, not text.
allowed-confusables = ["’", "‘", "—", "–", "…"]
select = [
    "A",    # builtin shadowing
    "ARG",  # unused arguments
    "B",    # bugbear
    "C4",   # comprehensions
    "DTZ",  # naive datetimes — telemetry timestamps must be aware
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "PT",   # pytest style
    "PTH",  # use pathlib
    "RET",  # return simplification
    "RUF",
    "SIM",  # simplification
    "TID",  # tidy imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests assert on private helpers and use fixtures that shadow argument names.
"tests/*" = ["ARG001", "ARG002"]

# --- mypy ---------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest -------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "host_smoke: needs the target host — GPU, ROCm, or model weights. Excluded by ./scripts/gate.sh (INV-05).",
    "allow_network: opts out of the socket block. Reserved for `models fetch`, the only command INV-06 permits to touch the network.",
]
