[project]
name = "dnd-audio"
version = "0.1.0"
description = "Local audio ingestion and transcription for long tabletop-RPG sessions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# 3.12 exactly. The spec pins it and the target host's system interpreter is 3.13,
# so an upper bound is what makes an unactivated shell fail loudly (ADR-0002).
requires-python = ">=3.12,<3.13"

dependencies = [
    # M7a's archive commands, and nothing else in this project, use these two. Both are
    # imported lazily — `zstandard` inside `archive/codec.py`, `boto3` inside
    # `archive/spaces.py` — so no processing command loads either, and that is proved
    # behaviourally rather than promised: every non-archive command runs as a subprocess
    # under a socket-and-client trap (INV-06, ADR-0035).
    #
    # `zstandard` carries libzstd inside its own wheel, which is the point of choosing it
    # over the `zstd` CLI: archive v1's byte-stability then rests on this lock like every
    # other output-affecting dependency, rather than on whatever happens to be on PATH.
    # 0.25.0 bundles libzstd 1.5.7, the version the four-file trial measured (ADR-0037).
    "boto3>=1.35",
    "zstandard>=0.23",
    # The ceiling is not this project's own need — nothing here cares which side of 2.5
    # numpy sits on. It comes from `qwen-asr` -> `librosa` -> `numba`, and it is stated
    # here rather than in the group because uv resolves one numpy for the whole lock, so
    # a constraint hidden in an opt-in group would silently decide the version the
    # everyday environment gets. Newest numba (0.66.0) requires `numpy<2.5`; without this
    # ceiling the resolver satisfies librosa by backtracking to numba 0.53.1 (2021), whose
    # metadata declares no numpy bound and whose sdist refuses to build on anything past
    # Python 3.9 — a five-year-old package chosen silently, failing only at build time.
    # Lift it when numba supports 2.5 (M6b).
    "numpy>=2.1,<2.5",
    "onnxruntime>=1.20",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "typer>=0.15",
]

[project.scripts]
dnd-audio = "dnd_audio.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "scipy-stubs>=1.18.0.1",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
]

# The heavyweight runtime, isolated. None of this belongs in the environment the default
# test suite runs in (INV-05), so the group is opt-in: it is absent from
# `[tool.uv] default-groups`, a plain `uv sync` installs none of it, and it is installed
# into a *separate* environment — `nix run .#fhs -- -c 'UV_PROJECT_ENVIRONMENT=.venv-rocm
# uv sync --group asr-qwen'` — so the everyday gate keeps running the group-absent case
# rather than proving it once (ADR-0025).
#
# Everything here is pinned exactly, and every pin is a decision rather than a floor:
#
# * **torch 2.9.1+rocm7.13.0.** Not the newest build on the index — 2.10.0 and 2.11.0
#   are also published for cp312 — and deliberately so. ROCm 7.13 is the generation
#   this host already runs a GPU workload on, which is evidence about the *runtime*;
#   there is no host evidence about any torch version, so the tie-break is a patch
#   release over two x.y.0 releases. "Tested" beats "newest" here (ADR-0025).
# * **rocm[libraries] and triton.** Torch's own requirements, and they are listed here
#   rather than left transitive because `[tool.uv.sources]` only routes packages that
#   are *direct* members of a dependency list. A transitive-only requirement silently
#   resolves from PyPI no matter what the sources table says — where `rocm` is an
#   unrelated placeholder at 0.1.0. Measured, not assumed; see ADR-0025.
# * **transformers and accelerate**, at the exact versions `qwen-asr` 0.0.6 pins. They
#   are here rather than in M6b because the charter's lock assertion is about *them*:
#   accelerate requires `torch>=2.0.0`, and the failure this milestone exists to
#   prevent is that requirement quietly resolving a CUDA build from ordinary PyPI.
#   With torch alone in the lock nothing competes for it and the assertion proves
#   nothing. Pinning them to what M6b will actually need means M6b does not relock and
#   redownload a multi-gigabyte environment this milestone just settled.
#
# * **qwen-asr**, added in M6b. It pins `transformers==4.57.6` and `accelerate==1.12.0`
#   itself, which is why M6a put those two here a milestone early at exactly those
#   versions: adding this package must not relock a multi-gigabyte stack that was
#   already settled and proved on the device. It also brings `nagisa`, `soynlp`,
#   `qwen-omni-utils`, `librosa`, `soundfile`, `sox`, `gradio`, `flask` and `pytz` —
#   all from PyPI, none of them AMD-only, so none needs a `[tool.uv.sources]` entry.
#   `vllm` is an extra and is deliberately not requested (ADR-0028).
asr-qwen = [
    "torch==2.9.1+rocm7.13.0",
    "rocm[libraries]==7.13.0",
    "rocm-sdk-core==7.13.0",
    "rocm-sdk-libraries-gfx1151==7.13.0",
    "triton==3.5.1+rocm7.13.0",
    "transformers==4.57.6",
    "accelerate==1.12.0",
    "qwen-asr==0.0.6",
    # A floor, not a pin, and it is here to make a future failure loud. `librosa` asks
    # only for `numba>=0.51`, so when a numpy bump next outruns numba the resolver's
    # cheapest escape is to walk backwards through numba releases until it finds one whose
    # metadata declares no numpy ceiling — arriving at 2021 and failing in a compiler
    # rather than in the resolver. With this floor that search has nowhere to go and uv
    # reports the real conflict instead. Same principle as routing every AMD-only package
    # explicitly: the danger is not the wrong answer, it is the wrong answer arrived at
    # quietly (ADR-0025).
    "numba>=0.62",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- uv: the AMD gfx1151 wheel index ------------------------------------------

# `explicit = true` is the whole point. Without it this index becomes a candidate
# source for *every* package, and it carries its own numpy, setuptools, jinja2 and
# typing-extensions — so an unrelated dependency would start resolving from AMD's
# mirror for no reason and with no record of why. Explicit means nothing comes from
# here unless `[tool.uv.sources]` below names it.
#
# Declared in configuration rather than passed as `--index-url` on a command line,
# because a command-line index choice is one forgotten flag away from a CUDA build,
# and nothing in the lock would say that had happened (ADR-0025).
[[tool.uv.index]]
name = "amd-gfx1151"
url = "https://repo.amd.com/rocm/whl/gfx1151/"
explicit = true

# Per-package routing. Everything named here is either absent from PyPI or exists
# there as a *different build* under the same name, which is the dangerous case:
# `torch` on PyPI is a CUDA build that satisfies accelerate's `torch>=2.0.0` just as
# well as the gfx1151 one does, and only this table decides which wins. `rocm` on PyPI
# is an unrelated placeholder at 0.1.0.
#
# **An entry here does nothing unless the package is also a direct member of a
# dependency list.** uv applies this table when it resolves a name it was asked for by
# name, not when it discovers one inside another package's metadata — so routing a
# transitive-only requirement is silently ignored and it resolves from PyPI. That is
# why `rocm` and `triton` appear in the `asr-qwen` group above even though nothing in
# this project imports them: they are torch's requirements, and listing them is the
# only way this table reaches them (ADR-0025).
[tool.uv.sources]
torch = { index = "amd-gfx1151" }
rocm = { index = "amd-gfx1151" }
rocm-sdk-core = { index = "amd-gfx1151" }
rocm-sdk-libraries-gfx1151 = { index = "amd-gfx1151" }
triton = { index = "amd-gfx1151" }

[tool.hatch.build.targets.wheel]
packages = ["src/dnd_audio"]

# --- ruff ---------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# This project transcribes natural language. Curly quotes, dashes, and ellipses are what
# the models return and what a transcript must round-trip byte for byte, so they belong
# in test data and in prose. RUF001 is about confusable *identifiers*, not text.
allowed-confusables = ["’", "‘", "—", "–", "…"]
select = [
    "A",    # builtin shadowing
    "ARG",  # unused arguments
    "B",    # bugbear
    "C4",   # comprehensions
    "DTZ",  # naive datetimes — telemetry timestamps must be aware
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "PT",   # pytest style
    "PTH",  # use pathlib
    "RET",  # return simplification
    "RUF",
    "SIM",  # simplification
    "TID",  # tidy imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests assert on private helpers and use fixtures that shadow argument names.
"tests/*" = ["ARG001", "ARG002"]
# The recording S3 client mirrors boto3's own signatures, and boto3 spells every S3
# parameter in PascalCase — `Bucket`, `Key`, `UploadId`, `PartNumber`. Renaming them would
# make the stub stop matching the real call and defeat the point of having it. This is the
# provider's vocabulary, not a naming decision of ours.
"tests/test_archive_spaces.py" = ["ARG001", "ARG002", "N803"]

# --- mypy ---------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# `onnxruntime` ships no `py.typed`. It is wrapped behind the typed `OnnxSession` adapter in
# `activity/silero.py` and imported nowhere else, so nothing outside that module ever sees an
# untyped object (ADR-0013).
[[tool.mypy.overrides]]
module = ["onnxruntime"]
ignore_missing_imports = true

# `torch` is not installed in the environment the gate type-checks in, and deliberately so
# (INV-05): it lives in the opt-in `asr-qwen` group. The same treatment `onnxruntime`
# gets, and for a stronger reason — requiring torch to type-check would make the offline
# gate depend on a multi-gigabyte GPU stack. It is imported lazily inside the functions of
# `dnd_audio.runtime` and nowhere else, so nothing outside that module sees an untyped
# object (ADR-0026).
[[tool.mypy.overrides]]
module = ["torch"]
ignore_missing_imports = true

# `boto3` and `botocore` ship no `py.typed`. Same containment as `onnxruntime` and
# `torch`: they are imported lazily inside `archive/spaces.py` and nowhere else, and
# everything the client returns is reshaped immediately into the typed shapes
# `archive/storage.py` declares, so no untyped object escapes the adapter (ADR-0035,
# ADR-0037). Stub packages were not added because the adapter's whole job is to be the
# one place that touches the SDK.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

# `qwen_asr` ships no `py.typed` and, like torch, is not installed in the environment the
# gate type-checks in (INV-05). Same containment: it is imported lazily inside
# `load_qwen_backend` and nowhere else, and everything it returns is reshaped immediately
# into `QwenText`/`AlignedItem`, so no untyped object escapes `_TransformersBackend`
# (ADR-0028).
[[tool.mypy.overrides]]
module = ["qwen_asr", "qwen_asr.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest -------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `-n 8` is pytest-xdist, and it lives here rather than in `./scripts/gate.sh` on purpose.
# Parallelism kept in the gate script is a rule held by convention: it covers the gate and
# leaves every ad-hoc `uv run pytest` an agent types mid-implementation running serially,
# which is the shape this project keeps rediscovering — honoured everywhere it was thought
# about, missed in the one place nobody was. In configuration it is a mechanism instead, and
# it reaches Codex, an editor's test runner, and a human at a shell without any of them
# having to know. The gate defers to this number rather than repeating it, for the same
# reason the mypy invocation does: the editor, the CLI, and the gate cannot disagree about
# it if only one of them says it.
#
# Eight, not `auto`. The suite's speedup ceiling is not core count — the pipeline stages
# already thread internally, so on the 32-core target host the curve is flat from about 8
# workers up (re-measured 2026-08-05: 8 → 56 s, 16 → 53-58 s, 24 → 60 s, against 202 s
# serial — sixteen is inside the noise and twenty-four is worse).
# What is *not* flat is worker startup, which every invocation pays: on one fast unit file
# `-n 8` costs 0.7 s where `-n auto` costs 1.8 s, and a tight edit-test loop pays that
# dozens of times. Eight buys the whole speedup at a quarter of the fixed cost. It
# oversubscribes a 4-core machine mildly, which is the accepted trade.
#
# That re-measurement is worth keeping, because for a while it did *not* look flat. M10
# roughly doubled the suite, and at 3116 tests it read 8 → 103 s but 24 → 75 s, which looks
# like an argument for more workers. It was not. It was an argument for a cheaper suite: the
# marker detector was quantizing correlation scores through a Python call per sample, so its
# tests were single-threaded numpy work that more processes could spread but nothing could
# make cheap. Vectorizing that (`marker.detect.to_permille_array`) and building
# `test_marker_analyze.py`'s ingested session once instead of per test took the suite back
# under a minute, and the ceiling came back to eight. If this curve ever tilts toward more
# workers again, look for a hot path before raising the number.
#
# `-n 0` on the command line overrides this and runs in-process. Reach for it under a
# debugger or with `-s`: xdist captures worker output and swallows both.
addopts = "-ra --strict-markers --strict-config -n 8"
markers = [
    "host_smoke: needs the target host — GPU, ROCm, or model weights. Excluded by ./scripts/gate.sh (INV-05).",
    "allow_network: opts out of the socket block. Reserved for `models fetch`, the only command INV-06 permits to touch the network.",
]
