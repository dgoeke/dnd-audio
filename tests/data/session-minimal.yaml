# The same session as session-valid.yaml with every default omitted.
#
# This file exists to prove one property: a configuration that leaves a default unstated
# must resolve — and therefore hash — identically to one that states it. Without that,
# adding an explicit `max_new_tokens: 1024` to a session file would invalidate every
# cached ASR result for no reason (INV-08).
#
# `timecode.origin_date` is stated because it has no default and must not be inferred
# from a date-looking session_id.
